<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="logo">
            <a href="#"> <img src="categories/myntra_logo.webp" class="myntra_logo" alt="logo"> </a>
        </div>

        <nav class="nav-bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
        </nav>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input placeholder="search for products, brands and more" class="search-input">
        </div>

        <div class="actin-bar">
            <div class="action-container">
                <i class="fa-regular fa-user"></i>
                <span class="action-name">Profile</span>
            </div>
        </div>

        <div class="actin-bar">
            <div class="action-container">
                <i class="fa-regular fa-heart"></i>
                <span class="action-name">Wishlist</span>
            </div>
        </div>

        <div class="actin-bar">
            <div class="action-container">
                <i class="fa-regular fa-bag-shopping"></i>
                <span class="action-name">Bag</span>
            </div>
        </div>

    </header>
    <main>
        <div class="banner-container">
            <img class="banner-image" src="categories/banner.jpg" alt="main image">
        </div>
        <div class="category-heading">MEDAL WORTHY BRANDS TO BAG</div>
        <div class="category-items">
            <a href="#"> <img class="sale-item" src="offers/1.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/2.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/3.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/4.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/5.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/6.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/7.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/8.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/9.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/10.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/11.png"> </a>
            <a href="#"> <img class="sale-item" src="offers/12.png"> </a>
        </div>

        <div class="category-heading">SHOP BY CATEGORY</div>
        <div class="category-items">
            <a href="#"> <img class="sale-item" src="categories/1.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/2.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/3.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/4.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/5.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/6.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/7.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/8.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/9.jpg"> </a>
            <a href="#"> <img class="sale-item" src="categories/10.jpg"> </a>
        </div>

    </main>
    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h3>ONLINE SHOPPING</h3>
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="#">Kids</a>
                <a href="#">Home & Living</a>
                <a href="#">Beauty</a>
                <a href="#">Gift Card</a>     
                <a href="#">Myntra Insider</a>     
            </div>
        </div>
    </footer>
</body>

</html>
